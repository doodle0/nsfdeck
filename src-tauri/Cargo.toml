[package]
name = "nsfdeck"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform NSF/NSFe player built on the NSFPlay emulation core"
publish = false

[[bin]]
name = "nsfdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nsfplay-core = { path = "../crates/nsfplay-core", features = ["output"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
